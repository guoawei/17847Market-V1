<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <style>
      body {
        font-family: "Arial", "Microsoft JhengHei", sans-serif;
        margin: 0;
        padding: 0;
      }
      .email-wrapper {
        background-color: #f4f4f4;
        padding: 40px 20px;
        min-height: 100vh;
      }
      .container {
        max-width: 600px;
        margin: 40px auto;
        background-color: #ffffff;
        border-radius: 8px;
        border: 1px solid #e0e0e0;
        overflow: hidden;
      }
      .logo-container {
        text-align: center;
      }
      .logo {
        border: 0px solid #eeeeee;
        border-radius: 8px;
      }
      .content {
        padding: 40px 30px;
      }
      .info-text {
        color: #666;
        font-size: 14px;
        line-height: 1.6;
      }
      .link {
        padding: 20px 0;
      }
      .check-button {
        display: inline-block;
        font-size: 14px;
        padding: 12px 16px;
        border: 0px;
        border-radius: 4px;
        background-color: #333;
        color: white;
        text-decoration: none;
      }
      .check-button:hover {
        cursor: pointer;
      }
      .footer {
        background-color: #f8f9fa;
        padding: 20px;
        text-align: center;
        color: #6c757d;
        font-size: 12px;
      }
    </style>
  </head>
  <body>
    <div class="email-wrapper">
      <div class="container">
        <div class="content">
          <div class="logo-container">
            <img
              src="https://17847market-dev-bucket.s3.ap-east-2.amazonaws.com/mail/17847market-logo-square.png"
              width="80px"
              height="100%"
              class="logo"
            />
          </div>
          <h1>攤商資料建立成功</h1>
          <p class="info-text">
            歡迎加入擺個市集！你的攤商 MK米奇盆栽手作 資料已建立完成。<br />
            現在就可以開始瀏覽平台上的市集活動，找到適合你的市集並立即報名。
          </p>

          <div class="link">
            <a
              href="https://17847market.com.tw"
              target="_blank"
              class="check-button"
              >探索市集活動</a
            >
          </div>

          <p class="info-text">
            你可隨時登入擺個市集更新攤商資料，完整的介紹與商品照片能讓市集主更認識你喔！
          </p>
        </div>
        <div class="footer">
          <p>此為系統自動發送的郵件，請勿直接回覆</p>
          <p>&copy; 2026 擺個市集 17847Market. All rights reserved.</p>
        </div>
      </div>
    </div>
  </body>
</html>
